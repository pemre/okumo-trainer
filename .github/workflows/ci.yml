name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bunx biome check src scripts

      - name: Test (aralıklı tekrar + veri sözleşmeleri)
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
